<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta
      name="description"
      content="The only connection you need is with God."
    />
    <title>Strong Connection!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f1e8;
        --ink: #252820;
        --muted: #77776d;
        --line: #d8d0c1;
        --accent: #9b8055;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(
            ellipse at 50% 42%,
            rgba(255, 255, 255, 0.72) 0%,
            rgba(245, 241, 232, 0) 58%
          ),
          var(--paper);
        color: var(--ink);
      }
      main {
        width: min(100%, 760px);
        min-height: min(680px, calc(100svh - 56px));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: clamp(28px, 7vw, 72px) clamp(18px, 5vw, 48px);
        border: 1px solid rgba(155, 128, 85, 0.25);
        outline: 1px solid rgba(155, 128, 85, 0.12);
        outline-offset: 7px;
        animation: appear 1.1s ease both;
      }
      .ornament {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: clamp(34px, 7vh, 62px);
        color: var(--accent);
      }
      .ornament::before,
      .ornament::after {
        content: "";
        width: 42px;
        height: 1px;
        background: var(--line);
      }
      .ornament span {
        font-size: 19px;
        line-height: 1;
      }
      h1 {
        max-width: 620px;
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.65rem, 8vw, 5.4rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.13;
        text-wrap: balance;
      }
      h1 em {
        color: #8a704b;
        font-weight: 400;
      }
      .rule {
        width: 42px;
        height: 1px;
        margin: clamp(30px, 6vh, 48px) 0 22px;
        background: var(--accent);
      }
      .footer {
        margin: 0;
        color: var(--muted);
        font:
          500 0.68rem/1.6 "DM Sans",
          sans-serif;
        letter-spacing: 0.22em;
        /* text-transform: uppercase; */
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
      }
      @media (max-height: 520px) {
        main {
          min-height: auto;
          padding-block: 36px;
        }
        .ornament {
          margin-bottom: 24px;
        }
        .rule {
          margin-block: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ornament" aria-hidden="true"><span>✧</span></div>
      <h1>The only connection you need is with <em>GOD.</em></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="footer">NLC Camp 2026</p>
    </main>
  </body>
</html>
